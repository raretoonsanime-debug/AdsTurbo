name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-22.04
    env:
      FRIDA_VERSION: 16.4.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev xz-utils unzip
      - name: fetch frida
        run: |
          set -e
          B=https://github.com/frida/frida/releases/download/$FRIDA_VERSION
          mkdir -p app/src/main/cpp app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 app/src/main/assets
          for pair in "arm64:arm64-v8a" "x86_64:x86_64"; do
            k=${pair%%:*}; abi=${pair##*:}
            d=/tmp/dev-$k; mkdir -p $d
            curl -fL $B/frida-core-devkit-$FRIDA_VERSION-android-$k.tar.xz | tar xJ -C $d
            find $d -name 'frida-core.h' -exec cp {} app/src/main/cpp/ \;
            find $d -name 'libfrida-core.*' -exec cp {} app/src/main/jniLibs/$abi/ \;
          done
          curl -fL $B/frida-server-$FRIDA_VERSION-android-arm64.xz | xz -dc > app/src/main/assets/frida-server-arm64
          curl -fL $B/frida-server-$FRIDA_VERSION-android-x86_64.xz | xz -dc > app/src/main/assets/frida-server-x86_64
          echo "=== frida-core signatures ==="
          grep -n "frida_script_post\|frida_script_load\|frida_device_get_process_by_name\|frida_script_on\|frida_init" app/src/main/cpp/frida-core.h | head -40
      - name: build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AdTurbo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
